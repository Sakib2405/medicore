name: medicore
description: A cross-platform medical management application with AI features
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase Core
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.3
  firebase_messaging: ^16.0.3
  firebase_app_check: ^0.4.1+2
  # app_links removed (unused)


  geolocator: ^9.0.2

  flutter_facebook_auth: ^6.1.1


  # Google Services
  google_sign_in: ^6.2.0
  google_generative_ai: ^0.4.4

  # google_maps_flutter removed (unused)

  # State Management & HTTP
  provider: ^6.1.1
  dio: ^5.4.0
  http: ^1.0.0
  shared_preferences: ^2.2.2

  # UI & Design
  image_picker: ^1.1.1
  url_launcher: ^6.2.2
  flutter_local_notifications: ^19.5.0
  cached_network_image: ^3.3.0
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  badges: ^3.0.1

  # Forms (removed unused flutter_form_builder & validators)

  # Charts & Web
  fl_chart: ^1.1.1
  webview_flutter: ^4.4.2

  flutter_sslcommerz: ^3.0.1

  # File Management
  path: ^1.9.0

  # Utilities
  flutter_dotenv: ^6.0.0

  # Internationalization & Data
  intl: ^0.20.2
  uuid: ^4.2.1
  flutter_animate: ^4.2.1
  # PDF generation and viewing
  pdf: ^3.10.0
  printing: ^5.9.0
  path_provider: ^2.0.15
  open_filex: ^4.2.0
  speech_to_text: ^7.4.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/images/
    - assets/fonts/Inter-Variable.ttf
    # removed unused icons and animations folders
  

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2196F3"
  adaptive_icon_foreground: "assets/images/logo.png"
  remove_alpha_ios: true